  <body>
    <div class="sky-scene" aria-hidden="true">
      <span class="sky-bird" style="--altitude:19%;--size:110px;--duration:55s;--delay:-43s;--rest-x:17%;--opacity:.78"><span class="bird-wings"></span></span>
      <span class="sky-bird" style="--altitude:28%;--size:78px;--duration:67s;--delay:-16s;--rest-x:76%;--opacity:.58;--flap:1.65s"><span class="bird-wings"></span></span>
      <span class="sky-bird" style="--altitude:73%;--size:96px;--duration:73s;--delay:-12s;--rest-x:10%;--opacity:.68;--flap:1.5s"><span class="bird-wings"></span></span>
      <span class="sky-bird" style="--altitude:83%;--size:70px;--duration:61s;--delay:-39s;--rest-x:81%;--opacity:.5;--flap:1.3s"><span class="bird-wings"></span></span>
      <span class="sky-bird" style="--altitude:46%;--size:86px;--duration:83s;--delay:-68s;--rest-x:87%;--opacity:.56;--flap:1.8s"><span class="bird-wings"></span></span>
    </div>
    <button class="sky-toggle" id="sky-toggle" type="button" aria-label="Pause birds" aria-pressed="false" hidden>
      <svg class="sky-pause" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="M2 1h2v8H2zM6 1h2v8H6z" /></svg>
      <svg class="sky-play" width="10" height="10" viewBox="0 0 10 10" fill="currentColor" aria-hidden="true"><path d="m3 1 6 4-6 4z" /></svg>
      <span id="sky-toggle-label">Pause birds</span>
    </button>
    <div class="site-shell">
      <header class="navbar">
        <a class="wordmark" href="#" aria-label="PicoBoi home">PicoBoi<span class="wordmark-period">.</span></a>
        <nav aria-label="Main navigation"><a class="nav-link" id="about-link" href="./about/">about <span aria-hidden="true">↗</span></a></nav>
      </header>

      <main id="chat-page" class="chat-page">
        <section class="chat-stage" aria-labelledby="chat-heading">
          <div class="welcome" id="welcome">
            <h1 id="chat-heading">Say hello to PicoBoi</h1>
            <p class="welcome-subtitle">A little space for whatever’s on your mind.</p>
          </div>

          <div class="conversation-header" id="conversation-header" hidden>
            <span class="conversation-title">Your conversation</span>
            <button class="text-button" id="new-chat" type="button">New chat <span aria-hidden="true">↗</span></button>
          </div>
          <div class="messages" id="messages" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions" hidden></div>

          <form class="composer" id="chat-form" aria-label="Send a message" aria-describedby="model-help">
            <label class="sr-only" for="message-input">Your message</label>
            <textarea id="message-input" rows="2" maxlength="1000" placeholder="What’s on your mind?" autocomplete="off"></textarea>
            <div class="composer-bottom">
              <div class="model-controls">
                <div class="model-picker" id="model-picker">
                  <button id="model-select" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="model-menu" aria-describedby="model-status">
                    <span>PicoBoi-100K</span>
                    <svg class="model-chevron" width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" /></svg>
                  </button>
                  <div class="model-menu" id="model-menu" role="menu" aria-label="Choose a model" hidden>
                    <button class="model-option" id="model-100k" type="button" role="menuitemradio" aria-checked="true" tabindex="-1">
                      <span>PicoBoi-100K</span>
                      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 10 3 3 7-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></svg>
                    </button>
                    <button class="model-option" type="button" role="menuitemradio" aria-checked="false" aria-disabled="true" tabindex="-1" disabled>
                      <span>PicoBoi-10M</span><span class="coming-soon">Coming soon</span>
                    </button>
                  </div>
                </div>
                <span class="model-status"><span class="status-dot" aria-hidden="true"></span><span id="model-status" role="status">Loading…</span></span>
              </div>
              <button class="send-button" id="send-button" type="submit" aria-label="Send message" disabled>
                <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 19V5m0 0-6 6m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" /></svg>
              </button>
            </div>
          </form>

          <p class="model-help" id="model-help">100K experiment · 800-word vocabulary · 128-token context. Replies can be wrong.</p>
          <label class="web-lookup-option"><input type="checkbox" id="web-lookup" checked /> Look up unfamiliar topics</label>

          <div class="suggestions" id="suggestions" aria-label="Conversation starters">
            <button type="button" data-prompt="the red ball is on the table. where is it?">Find the ball <span aria-hidden="true">↗</span></button>
            <button type="button" data-prompt="i have two apples. i get three more. how many do i have now?">Count apples <span aria-hidden="true">↗</span></button>
            <button type="button" data-prompt="please fix this sentence: he are happy.">Fix a sentence <span aria-hidden="true">↗</span></button>
          </div>
        </section>
      </main>


      <footer class="privacy-note" id="privacy-note">the model runs in your browser · web lookups contact Wikipedia · chats are not saved by this page</footer>
    </div>
  </body>
</html>
